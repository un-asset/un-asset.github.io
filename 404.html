<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#305496">
<title>유엔 물품관리</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
  :root{--blue:#305496;--blue2:#e8eef8;--bg:#f2f4f7;--card:#fff;--text:#222;--sub:#666;--line:#e5e7eb;--red:#c00000}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--text);
       padding-bottom:calc(72px + env(safe-area-inset-bottom))}
  header{background:var(--blue);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px}
  header h1{font-size:17px;margin:0;flex:1}
  header button{background:none;border:0;color:#fff;font-size:20px;cursor:pointer;padding:4px 8px}
  main{max-width:640px;margin:0 auto;padding:16px}
  .card{background:var(--card);border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.1);margin-bottom:12px;overflow:hidden}
  .pad{padding:14px 16px}
  input,select,textarea{width:100%;padding:11px 12px;font-size:16px;border:1px solid #ccc;border-radius:8px;font-family:inherit;background:#fff}
  textarea{min-height:80px;resize:vertical}
  label{display:block;font-size:13px;color:var(--sub);margin:12px 0 4px}
  .btn{display:block;width:100%;padding:13px;border:0;border-radius:8px;background:var(--blue);color:#fff;font-size:15px;font-weight:bold;cursor:pointer;font-family:inherit}
  .btn.sub{background:var(--blue2);color:var(--blue)}
  .btn:disabled{opacity:.5}
  .chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px}
  .chip{flex:none;padding:6px 12px;border-radius:16px;border:1px solid #ccc;background:#fff;font-size:13px;cursor:pointer}
  .chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .item{padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer}
  .item:last-child{border-bottom:0}
  .item b{font-size:15px}
  .item .s{font-size:13px;color:var(--sub);margin-top:3px}
  .tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:4px;background:#fde2e2;color:var(--red);margin-left:4px}
  .head{background:var(--blue);color:#fff;padding:16px}
  .head .t{font-size:19px;font-weight:bold;word-break:break-all}
  .head .s{font-size:13px;opacity:.85;margin-top:4px}
  table{width:100%;border-collapse:collapse}
  td{padding:10px 16px;border-bottom:1px solid var(--line);font-size:15px;vertical-align:top}
  td.k{color:var(--sub);width:90px;white-space:nowrap}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .grid .btn{padding:14px 6px}
  nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;
      padding-bottom:env(safe-area-inset-bottom);z-index:5}
  nav a{flex:1;text-align:center;padding:9px 0 8px;color:var(--sub);text-decoration:none;font-size:12px}
  nav a svg{display:block;width:24px;height:24px;margin:0 auto 3px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  nav a.on{color:var(--blue);font-weight:bold}
  .sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:10}
  .sheet.show{display:flex}
  .sheet .box{background:#fff;width:100%;max-width:640px;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
  .sheet h3{margin:0 0 4px}
  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#333;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;display:none;z-index:20;max-width:90%;text-align:center}
  .muted{color:var(--sub);font-size:13px;text-align:center;padding:24px 0}
  .err{color:var(--red);font-size:13px;margin-top:8px}
  .hint{font-size:13px;color:var(--sub);margin:6px 0 0}
  #admin{position:relative;display:none}
  header button svg{display:block;width:22px;height:22px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .foot{text-align:center;margin:28px 0 8px;font-size:12px}.foot a{color:#999;text-decoration:none}
  #badge{position:absolute;top:0;right:0;background:#e53935;color:#fff;font-size:11px;font-weight:bold;border-radius:9px;min-width:18px;padding:1px 5px;display:none}
  .rq .top{display:flex;justify-content:space-between;align-items:center}
  .rq .ty{font-weight:bold;font-size:15px}
  .rq .dt{font-size:12px;color:var(--sub)}
  .rq .ln{font-size:14px;margin-top:4px;word-break:break-all}
  .rq .memo{background:var(--bg);border-radius:8px;padding:8px 10px;margin-top:8px;font-size:14px;white-space:pre-wrap}
  .rq .act{display:grid;grid-template-columns:2fr 1fr;gap:8px;margin-top:12px}
  .btn.ok{background:#2e7d32}
  .btn.no{background:#fde2e2;color:var(--red)}
  .hist .h{padding:10px 16px;border-top:1px solid var(--line);font-size:14px;word-break:break-all}
  .hist .d{font-size:12px;color:var(--sub);margin-bottom:2px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style>
</head>
<body>
<header><h1 id="title">유엔 물품관리</h1><button id="admin" title="알림 (대기 중인 요청)"><svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2.2 2.2 0 0 0 4 0"/></svg><span id="badge"></span></button><button id="reload" title="새로 고침"><svg viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.5 4.5v4h-4"/></svg></button></header>
<main id="view"><div class="muted">불러오는 중…</div></main>
<nav>
  <a href="#/" data-r="home"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>검색</a>
  <a href="#/scan" data-r="scan"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16"/><rect x="8" y="8" width="3" height="3" rx=".5"/><rect x="13" y="8" width="3" height="3" rx=".5"/><rect x="8" y="13" width="3" height="3" rx=".5"/><path d="M13 13h3v3"/></svg>QR 스캔</a>
  <a href="#/new" data-r="new"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8.5v7M8.5 12h7"/></svg>새 물품</a>
</nav>
<div class="sheet" id="sheet"><div class="box" id="sheetBox"></div></div>
<div class="toast" id="toast"></div>

<script>
// ▼ 구글 웹앱 주소. 주소가 바뀌면 이 한 줄만 고치세요. (index.html, 404.html 둘 다)
var WEBAPP = 'https://script.google.com/macros/s/AKfycbxfMqPwY45tMT6yZM9Au3KqKKFk-cRH5VPAY5khVu8j93Dfdf_i7GbfjWBfvPu0Dv5Ffw/exec';

try { localStorage.removeItem('un_name'); } catch (e) {}   // 예전에 기억한 신청자 이름 지우기
var S = { meta: null, items: null, q: '', site: '전체', hideOld: true };
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k) || ''; localStorage.setItem(k, v); } catch (e) { return ''; } }
function toast(t) { var el = $('toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(function () { el.style.display = 'none'; }, 3000); }

function api(params) {
  if (params.pin === undefined) params.pin = store('un_pin');   // 한 번 입력한 PIN은 이 기기에 기억
  var qs = Object.keys(params).map(function (k) { return encodeURIComponent(k) + '=' + encodeURIComponent(params[k] == null ? '' : params[k]); }).join('&');
  return fetch(WEBAPP + '?' + qs).then(function (r) { return r.json(); }).then(function (d) {
    if (d.needPin) { var e = new Error('PIN이 필요해요'); e.needPin = true; throw e; }
    if (d.needAdmin) { var e2 = new Error(d.error || '관리자 PIN이 맞지 않아요'); e2.needAdmin = true; throw e2; }
    if (!d.ok) throw new Error(d.error || '오류'); return d;
  });
}

// ---------- PIN 입력 (처음 한 번만) ----------
function viewPin(msg) {
  closeSheet();
  $('title').textContent = '유엔 물품관리';
  $('view').innerHTML = '<div class="card pad" style="text-align:center"><div style="font-size:40px">🔒</div>' +
    '<b>회사 PIN을 입력해 주세요</b><p class="hint">처음 한 번만 입력하면 이 기기에서는 다시 묻지 않아요.</p>' +
    '<input id="pin" type="password" inputmode="numeric" autocomplete="off" style="text-align:center;font-size:22px;letter-spacing:6px;margin-top:12px">' +
    '<div id="p_err" class="err">' + esc(msg || '') + '</div><button class="btn" id="p_ok" style="margin-top:12px">확인</button></div>';
  $('pin').focus();
  var go = function () {
    var v = $('pin').value.trim(); if (!v) return;
    $('p_ok').disabled = true;
    api({ api: 'auth', pin: v }).then(function () {
      store('un_pin', v); S.items = null; route();
    }).catch(function (e) { $('p_ok').disabled = false; $('p_err').textContent = /PIN|오류/.test(e.message) ? 'PIN이 맞지 않아요.' : e.message; });
  };
  $('p_ok').onclick = go;
  $('pin').onkeydown = function (e) { if (e.key === 'Enter') go(); };
}
function loadAll(force) {
  if (S.items && !force) return Promise.resolve();
  return Promise.all([api({ api: 'meta' }), api({ api: 'list' })]).then(function (r) { S.meta = r[0]; S.items = r[1].items; });
}

// 라벨 QR(/A15)로 들어오면 그 물품 화면으로
(function () {
  var code = location.pathname.replace(/^\/+|\/+$/g, '');
  if (code && !/\.html$/i.test(code)) history.replaceState(null, '', '/#/i/' + encodeURIComponent(code.toUpperCase()));
})();

function route() {
  closeSheet();
  $('admin').style.display = store('un_apin') ? 'block' : 'none';
  var parts = location.hash.replace(/^#\/?/, '').split('/');
  var r = parts[0] || 'home';
  document.querySelectorAll('nav a').forEach(function (a) { a.classList.toggle('on', a.dataset.r === r); });
  $('view').innerHTML = '<div class="muted">불러오는 중…</div>';
  loadAll().then(function () {
    if (r === 'i') return viewItem(decodeURIComponent(parts[1] || ''));
    if (r === 'scan') return viewScan();
    if (r === 'new') return viewNew();
    if (r === 'admin') return viewAdmin();
    if (r === 'label') return viewLabel();
    if (r === 'add') return viewAdd();
    viewHome(); updateBadge();
  }).catch(function (e) {
    if (e.needPin) return viewPin(store('un_pin') ? 'PIN이 바뀌었어요. 새 PIN을 입력해 주세요.' : '');
    $('view').innerHTML = '<div class="card pad">불러오지 못했어요. 잠시 후 다시 시도해 주세요.<div class="err">' + esc(e.message) + '</div></div>';
  });
}
window.addEventListener('hashchange', route);
$('reload').onclick = function () { S.items = null; route(); toast('최신 내용으로 새로 고쳤어요'); };
$('admin').onclick = function () { location.hash = '#/admin'; if (location.hash === '#/admin') route(); };

// ---------- 검색 ----------
function viewHome() {
  $('title').textContent = '유엔 물품관리';
  var sites = ['전체'].concat(S.meta.sites.map(function (s) { return s.name; }));
  $('view').innerHTML =
    '<input id="q" type="search" placeholder="품명, 자산번호, 사용자, 모델명 검색" value="' + esc(S.q) + '">' +
    '<div class="chips">' + sites.map(function (s) { return '<button class="chip' + (s === S.site ? ' on' : '') + '" data-s="' + esc(s) + '">' + esc(s) + '</button>'; }).join('') + '</div>' +
    '<label style="display:flex;gap:6px;align-items:center;margin:8px 0"><input type="checkbox" id="old" style="width:auto"' + (S.hideOld ? ' checked' : '') + '> 폐기 물품 숨기기</label>' +
    '<div id="count" class="hint"></div><div class="card" id="list" style="margin-top:8px"></div>' +
    '<div class="foot"><a href="#/label">🏷 라벨 파일 받기</a> &nbsp;·&nbsp; ' + (store('un_apin') ? '<a href="#/add">➕ 물품 등록</a> &nbsp;·&nbsp; ' : '') +
    '<a href="#" id="alog">' + (store('un_apin') ? '관리자 로그아웃' : '관리자 로그인') + '</a></div>';

  $('alog').onclick = function (e) {
    e.preventDefault();
    if (!store('un_apin')) return viewAdminPin();
    if (!confirm('이 기기에서 관리자 로그아웃할까요?')) return;
    store('un_apin', ''); updateBadge(); viewHome(); toast('관리자 로그아웃했어요');
  };
  $('q').oninput = function () { S.q = this.value; renderList(); };
  $('old').onchange = function () { S.hideOld = this.checked; renderList(); };
  document.querySelectorAll('.chip').forEach(function (b) { b.onclick = function () { S.site = b.dataset.s; viewHome(); }; });
  renderList();
}
function renderList() {
  var q = S.q.trim().toLowerCase();
  var list = S.items.filter(function (it) {
    if (S.hideOld && it.discarded) return false;
    if (S.site !== '전체' && it.loc !== S.site) return false;
    return !q || [it.asset, it.name, it.model, it.spec, it.user, it.loc, it.detail, it.note, it.vendor].join(' ').toLowerCase().indexOf(q) >= 0;
  });
  $('count').textContent = list.length + '개';
  $('list').innerHTML = list.length ? list.slice(0, 200).map(function (it) {
    return '<div class="item" data-k="' + esc(it.code || it.asset) + '"><b>' + esc(it.asset) + '</b>' + (it.discarded ? '<span class="tag">폐기</span>' : '') +
      '<div class="s">' + esc([it.name, it.model].filter(Boolean).join(' · ')) + '</div>' +
      '<div class="s">📍 ' + esc(it.loc || '-') + (it.detail ? ' · ' + esc(it.detail) : '') + ' &nbsp; 👤 ' + esc(it.user || '-') + '</div></div>';
  }).join('') : '<div class="muted">찾는 물품이 없어요</div>';
  document.querySelectorAll('.item').forEach(function (el) { el.onclick = function () { location.hash = '#/i/' + encodeURIComponent(el.dataset.k); }; });
}

// ---------- 물품 화면 ----------
function findItem(key) {
  key = String(key).toUpperCase();
  return S.items.filter(function (x) { return String(x.code).toUpperCase() === key || x.asset.toUpperCase() === key; })[0];
}
var LABEL = { '이동': '🚚 이동', '고장': '🔧 고장', '사용자 변경': '👤 사용자 변경', '없음': '❓ 없음' };
function viewItem(key) {
  var it = findItem(key);
  if (!it) { $('view').innerHTML = '<div class="card"><div class="head"><div class="t">물품을 찾을 수 없어요</div></div><div class="pad">코드: ' + esc(key) + '<br><br>라벨을 다시 찍어 보거나 관리자에게 문의해 주세요.</div></div>'; return; }
  $('title').textContent = '물품 정보';
  var rows = [['품명', it.name], ['모델명', it.model], ['규격사양', it.spec], ['현재위치', it.loc], ['상세위치', it.detail], ['사용자', it.user], ['비고', it.note], ['렌탈업체', it.vendor], ['렌탈기간', it.rental]];
  $('view').innerHTML =
    '<div class="card"><div class="head"><div class="t">' + esc(it.asset) + '</div><div class="s">' + esc(it.sheet) + ' 시트 ' + it.row + '행' + (it.discarded ? ' · 폐기' : '') + '</div></div>' +
    '<table>' + rows.map(function (r) { return '<tr><td class="k">' + r[0] + '</td><td>' + (r[1] ? esc(r[1]) : '-') + '</td></tr>'; }).join('') + '</table></div>' +
    '<div class="card pad"><b>변경 신청</b><p class="hint">관리자가 승인하면 대장에 반영돼요.</p><div class="grid" style="margin-top:10px">' +
    Object.keys(LABEL).map(function (t) { return '<button class="btn sub" data-t="' + t + '">' + LABEL[t] + '</button>'; }).join('') +
    '</div><button class="btn sub" data-t="기타" style="margin-top:8px">✏️ 기타 요청</button></div>' +
    (store('un_apin') ? '<div class="card pad"><b>관리자</b><p class="hint">승인 없이 바로 대장에 반영돼요. (품명 · 프로젝트명은 라벨 보호를 위해 수정 불가)</p>' +
      '<div class="two" style="margin-top:10px"><button class="btn" id="a_edit">✏️ 수정</button><button class="btn no" id="a_del"' + (it.discarded ? ' disabled' : '') + '>' + (it.discarded ? '폐기됨' : '폐기 처리') + '</button></div></div>' : '') +
    '<div class="card"><div class="pad" style="padding-bottom:8px"><b>이력</b></div><div id="hist" class="hist"><div class="muted">불러오는 중…</div></div></div>';
  document.querySelectorAll('[data-t]').forEach(function (b) { b.onclick = function () { openRequest(it, b.dataset.t); }; });
  if ($('a_edit')) { $('a_edit').onclick = function () { openEdit(it, key); }; $('a_del').onclick = function () { discardItem(it, key); }; }
  loadHistory(it);
}
var HIST_ICON = { '이동': '🚚', '고장': '🔧', '사용자 변경': '👤', '없음': '❓', '기타': '✏️', '새 물품': '➕', '관리자 등록': '➕', '관리자 수정': '🛠', '엑셀 반영': '📤' };
function loadHistory(it) {
  api({ api: 'history', asset: it.asset }).then(function (d) {
    if (!$('hist')) return;
    $('hist').innerHTML = d.items.length ? d.items.map(function (h) {
      var st = h.status === '반영완료' ? '' : ' · <b>' + esc(h.status) + '</b>';
      return '<div class="h"><div class="d">' + esc(h.date) + ' · ' + esc(h.who) + st + '</div>' + (HIST_ICON[h.type] || '•') + ' ' + esc(h.type) +
        (h.result ? ' — ' + esc(h.result) : '') + (h.memo ? '<div class="d" style="margin-top:2px">' + esc(h.memo) + '</div>' : '') + '</div>';
    }).join('') : '<div class="muted" style="padding:14px">기록이 없어요</div>';
  }).catch(function () { if ($('hist')) $('hist').innerHTML = '<div class="muted" style="padding:14px">이력을 불러오지 못했어요</div>'; });
}
function siteOpts(sel) { return S.meta.sites.map(function (s) { return '<option' + (s.name === sel ? ' selected' : '') + '>' + esc(s.name) + '</option>'; }).join(''); }
function openEdit(it, key) {
  var f = function (id, label, v, ph) { return '<label>' + label + '</label><input id="' + id + '" value="' + esc(v || '') + '" placeholder="' + esc(ph || '') + '">'; };
  openSheet('<h3>✏️ 물품 수정</h3><div class="hint">' + esc(it.asset) + ' · ' + esc(it.name) + '</div>' +
    f('e_model', '모델명', it.model) + f('e_spec', '규격사양', it.spec) +
    '<label>현재위치</label><select id="e_loc">' + siteOpts(it.loc) + '</select>' +
    f('e_detail', '상세위치', it.detail, '예) 탕비실 A2') + f('e_user', '사용자', it.user) +
    '<label>비고</label><textarea id="e_note">' + esc(it.note || '') + '</textarea>' +
    '<div class="two"><div>' + f('e_vendor', '렌탈업체', it.vendor) + '</div><div>' + f('e_rental', '렌탈기간', it.rental) + '</div></div>' +
    '<div id="e_err" class="err"></div><button class="btn" id="e_ok" style="margin-top:14px">저장</button><button class="btn sub" id="e_no" style="margin-top:8px">취소</button>');
  $('e_no').onclick = closeSheet;
  $('e_ok').onclick = function () {

// ---------- QR 스캔 ----------
function codeFromText(t) {
  var m = String(t).match(/github\.io\/([A-Za-z0-9]+)/i); if (m) return m[1].toUpperCase();
  m = String(t).match(/[?&](?:id|q)=([^&]+)/); if (m) return decodeURIComponent(m[1]);
  return null;
}
function loadJsQR() {
  if (window.jsQR) return Promise.resolve();
  // 저장소에 올린 /jsQR.js를 먼저 쓰고, 없으면 외부(cdn)에서 불러와요.
  function load(src) { return new Promise(function (ok, no) { var s = document.createElement('script'); s.src = src; s.onload = function () { window.jsQR ? ok() : no(); }; s.onerror = no; document.head.appendChild(s); }); }
  return load('/jsQR.js').catch(function () { return load('https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js'); });
}
function viewScan() {
  $('title').textContent = 'QR 스캔';
  $('view').innerHTML = '<div class="card pad">' +
    '<label class="btn" style="text-align:center;padding:22px;font-size:17px">📸 사진으로 찍기<input id="photo" type="file" accept="image/*" capture="environment" style="display:none"></label>' +
    '<p class="hint">폰 카메라가 열리면 라벨 QR이 화면 가운데에 크게 나오게 찍어 주세요. 찍으면 바로 물품 화면으로 넘어가요.</p>' +
    '<div id="s_err" class="err"></div></div>' +
    '<div class="card pad"><b>더 간단한 방법</b><p class="hint">앱을 열지 않고 폰 기본 카메라로 라벨을 비추기만 해도 물품 화면이 열려요.</p></div>';
  $('photo').onchange = function () {
    var f = this.files[0]; if (!f) return;
    $('s_err').textContent = '사진을 읽는 중…';
    loadJsQR().then(function () {
      var img = new Image();
      img.onload = function () {
        var max = 1600, sc = Math.min(1, max / Math.max(img.width, img.height));
        var c = document.createElement('canvas'); c.width = img.width * sc; c.height = img.height * sc;
        var x = c.getContext('2d'); x.drawImage(img, 0, 0, c.width, c.height);
        var d = x.getImageData(0, 0, c.width, c.height), r = jsQR(d.data, d.width, d.height, { inversionAttempts: 'attemptBoth' });
        var code = r && codeFromText(r.data);
        if (code) location.hash = '#/i/' + encodeURIComponent(code);
        else $('s_err').textContent = 'QR을 찾지 못했어요. QR이 화면 가운데에 크게 나오게 다시 찍어 주세요.';
        URL.revokeObjectURL(img.src);
      };
      img.src = URL.createObjectURL(f);
    }).catch(function () { $('s_err').textContent = 'QR 읽기 도구를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.'; });
    this.value = '';
  };
}

function rqCard(x) {
  var lines = [];
  if (x.type === '새 물품') {
    lines.push('📍 ' + x.site + (x.detail ? ' · ' + x.detail : '') + ' · ' + x.name + (x.qty ? ' × ' + x.qty : ''));
    if (x.model || x.spec) lines.push([x.model, x.spec].filter(Boolean).join(' · '));
    if (x.newUser) lines.push('👤 사용자: ' + x.newUser);
  } else {
    lines.push('<a href="#/i/' + encodeURIComponent(x.asset) + '">' + esc(x.asset) + '</a>' + (x.name ? ' · ' + esc(x.name) : ''));
    if (x.type === '이동') lines.push('🚚 ' + esc((x.site || '-') + (x.oldDetail ? ' · ' + x.oldDetail : '')) + ' → <b>' + esc(x.moveTo + (x.detail ? ' · ' + x.detail : '')) + '</b>');
    if (x.type === '사용자 변경') lines.push('👤 새 사용자: <b>' + esc(x.newUser) + '</b>');
  }
  return '<div class="card pad rq" id="rq' + x.row + '"><div class="top"><span class="ty">' + (TYPE_ICON[x.type] || '') + ' ' + esc(x.type) + '</span>' +
    '<span class="dt">' + esc(x.date) + '</span></div>' +
    lines.map(function (l, i) { return '<div class="ln">' + (x.type === '새 물품' ? esc(l) : l) + '</div>'; }).join('') +
    '<div class="ln" style="color:var(--sub);font-size:13px">신청: ' + esc(x.requester) + '</div>' +
    (x.memo ? '<div class="memo">' + esc(x.memo) + '</div>' : '') +
    '<div class="act"><button class="btn ok">✅ 승인</button><button class="btn no">반려</button></div></div>';
}
function askReject(x, el) {
  openSheet('<h3>반려</h3><div class="hint">' + esc(x.type + ' · ' + (x.asset || x.name)) + '</div>' +
    '<label>반려 사유 (선택)</label><textarea id="r_why" placeholder="비워 둬도 돼요"></textarea>' +
    '<button class="btn no" id="r_ok" style="margin-top:14px">반려하기</button><button class="btn sub" id="r_no" style="margin-top:8px">취소</button>');

function decide(x, ok, reason, el) {

// ---------- 라벨 파일 받기 (P-touch용 엑셀) ----------
function viewLabel() {
  $('title').textContent = '라벨 파일 받기';
  var pre = S.labelPreset || {}; S.labelPreset = null;
  var sites = S.meta.sites.map(function (s) { return s.name; });
  $('view').innerHTML = '<div class="card pad"><p class="hint" style="margin-top:0">P-touch에 바로 연결하는 엑셀을 받아요. (시트 이름 "라벨출력", A열 자산번호 · B열 QR, 머리글 없음 · 폐기 물품 제외)</p>' +
    '<label>현장 (출처 시트)</label><select id="l_site">' + sites.map(function (s) { return '<option' + (s === pre.site ? ' selected' : '') + '>' + esc(s) + '</option>'; }).join('') + '</select>' +
    '<label>시작 행 (비우면 전체)</label><input id="l_start" type="number" min="5" max="500" value="' + (pre.start || '') + '" placeholder="예) 42 → 42행부터 (새로 넣은 물품만)">' +
    '<div id="l_info" class="hint" style="margin-top:10px"></div>' +
    '<button class="btn" id="l_ok" style="margin-top:12px">📥 엑셀 받기</button></div>' +
    '<div class="card pad"><b>P-touch에서 뽑는 방법</b><p class="hint">① 템플릿(.lbx) 열기 → ② 데이터베이스 → 연결 → 받은 파일의 "라벨출력" 시트 선택 (머리글 체크 해제) → ③ F1 = 자산번호, F2 = QR → ④ 인쇄</p></div>';
  var pick = function () {
    var site = $('l_site').value, st = parseInt($('l_start').value, 10) || 5;
    return S.items.filter(function (x) { return x.sheet === site && x.row >= st && !x.discarded && x.code; })
      .sort(function (a, b) { return a.row - b.row; });
  };
  var info = function () {
    var l = pick();
    $('l_info').innerHTML = l.length ? '<b>' + l.length + '개</b> · ' + esc(l[0].asset) + (l.length > 1 ? ' ~ ' + esc(l[l.length - 1].asset) : '') : '해당하는 물품이 없어요';
    $('l_ok').disabled = !l.length;
  };
  $('l_site').onchange = info; $('l_start').oninput = info;
  info();
  $('l_ok').onclick = function () {
    var l = pick(), site = $('l_site').value, st = $('l_start').value;
    var rows = l.map(function (x) { return [x.asset, 'HTTPS://UN-ASSET.GITHUB.IO/' + x.code]; });
    downloadXlsx('라벨_' + site + (st ? '_' + st + '행부터' : '') + '_' + ymd() + '.xlsx', [{ name: '라벨출력', rows: rows, widths: [30, 40] }]);
    toast(rows.length + '개 라벨 파일을 받았어요');
  };
}
function ymd() { var d = new Date(); return String(d.getFullYear()).slice(2) + ('0' + (d.getMonth() + 1)).slice(-2) + ('0' + d.getDate()).slice(-2); }

// ---------- 엑셀(.xlsx) 만들기: 외부 도구 없이 직접 생성 ----------
var CRC_T = (function () { var t = [], c; for (var n = 0; n < 256; n++) { c = n; for (var k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u) { var c = 0xFFFFFFFF; for (var i = 0; i < u.length; i++) c = CRC_T[(c ^ u[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }

  var u16 = function (v) { return [v & 255, (v >>> 8) & 255]; }, u32 = function (v) { return [v & 255, (v >>> 8) & 255, (v >>> 16) & 255, (v >>> 24) & 255]; };

    var head = [].concat(u32(0x04034b50), u16(20), u16(0x0800), u16(0), u16(0), u16(0x21), u32(crc), u32(data.length), u32(data.length), u16(name.length), u16(0));
    parts.push(new Uint8Array(head), name, data);
    central.push(new Uint8Array([].concat(u32(0x02014b50), u16(20), u16(20), u16(0x0800), u16(0), u16(0), u16(0x21), u32(crc), u32(data.length), u32(data.length),
      u16(name.length), u16(0), u16(0), u16(0), u16(0), u32(0), u32(off))), name);
    off += head.length + name.length + data.length;
  });
  var cdSize = central.reduce(function (s, a) { return s + a.length; }, 0);
  var end = new Uint8Array([].concat(u32(0x06054b50), u16(0), u16(0), u16(files.length), u16(files.length), u32(cdSize), u32(off), u16(0)));

function xmlEsc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, ''); }
function colName(i) { var s = ''; i++; while (i) { var m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; }
function makeXlsx(sheets) {
  var ns = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main', rns = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  var sst = [], idx = {};
  var si = function (v) { v = String(v); if (!(v in idx)) { idx[v] = sst.length; sst.push(v); } return idx[v]; };
  var files = [];
  sheets.forEach(function (sh, n) {
    var cols = sh.widths ? '<cols>' + sh.widths.map(function (w, i) { return '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' + w + '" customWidth="1"/>'; }).join('') + '</cols>' : '';
    var rows = sh.rows.map(function (r, ri) {
      return '<row r="' + (ri + 1) + '">' + r.map(function (v, ci) {
        if (v === '' || v == null) return '';

    files.push({ name: 'xl/worksheets/sheet' + (n + 1) + '.xml', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="' + ns + '">' + cols + '<sheetData>' + rows + '</sheetData></worksheet>' });
  });
  files.push({ name: 'xl/sharedStrings.xml', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><sst xmlns="' + ns + '" count="' + sst.length + '" uniqueCount="' + sst.length + '">' +
    sst.map(function (v) { return '<si><t xml:space="preserve">' + xmlEsc(v) + '</t></si>'; }).join('') + '</sst>' });
  files.push({ name: 'xl/styles.xml', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="' + ns + '"><fonts count="1"><font><sz val="11"/><name val="맑은 고딕"/></font></fonts>' +
    '<fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>' +
    '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/></cellXfs></styleSheet>' });
  files.push({ name: 'xl/workbook.xml', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="' + ns + '" xmlns:r="' + rns + '"><sheets>' +
    sheets.map(function (sh, n) { return '<sheet name="' + xmlEsc(String(sh.name).replace(/[\[\]:*?\/\\]/g, '').slice(0, 31)) + '" sheetId="' + (n + 1) + '" r:id="rId' + (n + 1) + '"/>'; }).join('') + '</sheets></workbook>' });
  files.push({ name: 'xl/_rels/workbook.xml.rels', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    sheets.map(function (sh, n) { return '<Relationship Id="rId' + (n + 1) + '" Type="' + rns + '/worksheet" Target="worksheets/sheet' + (n + 1) + '.xml"/>'; }).join('') +
    '<Relationship Id="rIdS" Type="' + rns + '/sharedStrings" Target="sharedStrings.xml"/><Relationship Id="rIdT" Type="' + rns + '/styles" Target="styles.xml"/></Relationships>' });
  files.push({ name: '_rels/.rels', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="' + rns + '/officeDocument" Target="xl/workbook.xml"/></Relationships>' });
  files.push({ name: '[Content_Types].xml', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/>' +
    '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
    sheets.map(function (sh, n) { return '<Override PartName="/xl/worksheets/sheet' + (n + 1) + '.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>'; }).join('') +
    '<Override PartName="/xl/sharedStrings.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sharedStrings+xml"/>' +
    '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>' });
  return zipStore(files.reverse());
}
function downloadXlsx(filename, sheets) {
  var url = URL.createObjectURL(makeXlsx(sheets)), a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1500);
}
